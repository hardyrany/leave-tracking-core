# ==============================================================================
# Workflow: Continuous Integration (CI)
# 
# Propósito: 
# Garantir que o código novo não "parte" o projeto. 
# Este workflow compila o projeto e corre os testes (JUnit) sempre que há 
# alterações na 'develop' ou quando se tenta fazer um PR para a 'main'.
# ==============================================================================

name: Continuous Integration (CI)

# Gatilho: Dispara em pushes para a 'develop' e em PRs para a 'develop' ou 'main'
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  # Nome do job que aparece na lista de status checks no GitHub
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Passo 1: Descarrega o código do repositório para a máquina virtual
      - name: Checkout repository
        uses: actions/checkout@v4

      # Passo 2: Instala o Java 21 e configura a cache do Maven (para ser mais rápido)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Passo 3: Corre os testes do Maven. 
      # O 'clean' limpa builds antigos, o 'test' compila e corre os JUnit.
      - name: Build and Run Tests
        run: mvn clean test -U

      # Passo 4: Gera o ficheiro .jar final (sem correr os testes outra vez)
      - name: Package Application
        run: mvn package -DskipTests